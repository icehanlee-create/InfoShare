<!DOCTYPE html>
<!-- 就業資訊公告欄 前端｜版本：v2.3.0（搭配 Code.gs v2.3.0 使用）
     v2.0.0 初版：置頂公告、逐日日曆頁、縣市／類型篩選
     v2.1.0 縣市標籤旁加註行政區（用猜的會加問號並用虛線標示）；新增月曆導覽，點日期跳到當天
     v2.1.1 手機上比較好用：月曆點日期改成「篩選成當天」，不用再捲動找卡片；再點一次或按「顯示全部」取消
     v2.1.2 沒有公告時，整個「公告」區塊（含標題）完全不顯示，不再留空區塊或提示文字
     v2.2.0 台灣就業通的活動卡片多一行職缺摘要，可展開看各公司職缺（薪資、地點、學歷經歷、人數），不用點進官網
     v2.2.1 某家公司沒有職缺時不再顯示「0 個職缺」；整場都沒職缺時只列參加公司
     v2.3.0 手機版日期改成每天上方的橫條（滑動時黏在頂端），卡片用滿全寬；電腦版維持日曆頁。
            頁尾顯示版本編號，網頁和後端版本不一致時會提醒
     ※ 之後每次改版，記得同步修改下方 FRONT_VER 和 Code.gs 的 APP_VER -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就業資訊公告欄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2330;
    --muted: #5B6675;
    --paper: #F3F5F8;
    --surface: #FFFFFF;
    --line: #D6DCE4;
    --navy: #1F3A5F;
    --tpe: #0E6E7E;
    --tpe-soft: #E1F1F3;
    --ntpc: #8F5200;
    --ntpc-soft: #FBEEDB;
    --pin: #FFF6CC;
    --radius-s: 6px;
    --radius-m: 10px;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.65;
  }
  a { color: var(--navy); }
  :focus-visible { outline: 3px solid #3B82C4; outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- 頁首 ---------- */
  .masthead {
    background: var(--navy);
    color: #fff;
    padding: 28px 0 24px;
    margin-bottom: 28px;
  }
  .masthead .wrap { padding-bottom: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
  .masthead h1 {
    margin: 0;
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 1.9rem;
    letter-spacing: .04em;
  }
  .masthead p { margin: 0; color: #C9D6E6; font-size: .9rem; }

  .demo-note {
    background: #FFF3C4; border: 1px solid #E5CB6A; color: #5C4A00;
    padding: 10px 14px; border-radius: var(--radius-s); margin-bottom: 24px; font-size: .9rem;
  }

  h2 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 1.35rem;
    margin: 0 0 14px;
    color: var(--navy);
  }
  section + section { margin-top: 44px; }

  /* ---------- 公告 ---------- */
  .notices { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--navy); }
  .notice { border-bottom: 1px solid var(--line); background: var(--surface); }
  .notice.pinned { background: var(--pin); }
  .notice details > summary {
    list-style: none; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline;
    padding: 14px 16px;
  }
  .notice summary::-webkit-details-marker { display: none; }
  .notice .n-date { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .notice .n-title { font-weight: 700; }
  .notice .pin-tag { font-size: .75rem; font-weight: 700; color: #7A5B00; margin-right: 6px; }
  .notice .chev { color: var(--muted); transition: transform .2s; }
  .notice details[open] .chev { transform: rotate(90deg); }
  .notice .n-body { padding: 0 16px 16px; white-space: pre-line; }
  .notice .n-body a { display: inline-block; margin-top: 8px; font-weight: 500; }

  /* ---------- 篩選 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-s); overflow: hidden; background: var(--surface); }
  .seg button {
    font: inherit; font-size: .9rem; border: 0; background: none; color: var(--ink);
    padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--navy); }
  .count { font-size: .85rem; color: var(--muted); margin: -6px 0 14px; }

  /* ---------- 活動：月曆導覽 ---------- */
  .calendar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px 14px 14px; margin-bottom: 20px; }
  .cal-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .cal-head button { font: inherit; font-size: 1.1rem; line-height: 1; border: 1px solid var(--line); background: var(--surface); color: var(--navy); width: 30px; height: 30px; border-radius: 999px; cursor: pointer; }
  .cal-head button:hover { background: var(--paper); }
  .cal-head .cal-label { font-weight: 700; color: var(--navy); min-width: 7em; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .78rem; color: var(--muted); padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-s); border: 1px solid transparent; background: none; font: inherit; color: var(--ink); cursor: default; padding: 2px; }
  .cal-cell.blank { visibility: hidden; }
  .cal-cell .cal-n { font-size: .88rem; font-variant-numeric: tabular-nums; }
  .cal-cell .cal-dot { display: flex; gap: 2px; height: 6px; }
  .cal-cell .cal-dot span { width: 6px; height: 6px; border-radius: 50%; background: var(--navy); }
  .cal-cell .cal-dot span.ntpc { background: var(--ntpc); }
  .cal-cell.has-events { cursor: pointer; border-color: var(--line); background: var(--paper); }
  .cal-cell.has-events:hover, .cal-cell.has-events:focus-visible { border-color: var(--navy); background: var(--tpe-soft); }
  .cal-cell.is-today .cal-n { color: #fff; background: var(--navy); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.is-past:not(.is-today) { opacity: .5; }
  .cal-cell.is-selected { background: var(--navy); border-color: var(--navy); }
  .cal-cell.is-selected .cal-n { color: #fff; }
  .cal-cell.is-selected.is-today .cal-n { background: #fff; color: var(--navy); }
  .cal-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); margin: 10px 0 -6px; }
  .cal-filter button { font: inherit; font-size: .85rem; color: var(--navy); font-weight: 700; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .cal-filter button:hover { background: var(--paper); }

  /* ---------- 活動：日曆頁 ---------- */
  .day { display: grid; grid-template-columns: 96px 1fr; gap: 16px; margin-bottom: 18px; }
  .leaf {
    align-self: start;
    position: sticky; top: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 8px solid var(--navy);
    border-radius: var(--radius-s);
    text-align: center;
    padding: 6px 4px 8px;
    line-height: 1.2;
  }
  .leaf .mo { display: block; font-size: .8rem; color: var(--muted); }
  .leaf .d {
    display: block;
    font-family: "Noto Serif TC", serif; font-weight: 900;
    font-size: 2.6rem; line-height: 1.05; font-variant-numeric: lining-nums;
  }
  .leaf .wd { display: block; font-size: .8rem; color: var(--muted); }
  .leaf .rel { display: block; margin-top: 6px; font-size: .78rem; font-weight: 700; color: var(--navy); }
  .leaf.is-today { background: var(--navy); color: #fff; }
  .leaf.is-today .mo, .leaf.is-today .wd, .leaf.is-today .rel { color: #D6E2F0; }
  .leaf.is-past { opacity: .55; }
  .leaf.undated .d { font-size: 1.1rem; padding: 14px 0; }
  .leaf .md { display: none; } /* 手機橫條用的「11/26」 */

  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ev {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--tpe);
    border-radius: var(--radius-s);
    padding: 12px 16px;
  }
  .ev.ntpc { border-left-color: var(--ntpc); }
  .ev.past { opacity: .55; }
  .ev .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .tag { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .tag.tpe { background: var(--tpe-soft); color: var(--tpe); }
  .tag.ntpc { background: var(--ntpc-soft); color: var(--ntpc); }
  .tag.type { background: #EEF1F5; color: var(--ink); font-weight: 500; }
  .tag.type.fair { background: var(--navy); color: #fff; font-weight: 700; }
  .tag .dist-guess { border-bottom: 1px dotted currentColor; cursor: help; }
  .ev h3 { margin: 0 0 4px; font-size: 1.02rem; font-weight: 700; line-height: 1.5; }
  .ev .meta { margin: 0; font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 16px; }
  .ev .meta a { font-weight: 500; }
  .ev .meta + .meta { margin-top: 2px; }
  .ev .addr a { color: var(--muted); text-decoration-style: dotted; font-weight: 400; }

  .empty, .error {
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-m);
    padding: 24px; color: var(--muted); text-align: center;
  }
  .error { border-style: solid; border-color: #E3A0A0; color: #8A1F1F; background: #FDF1F1; }
  .loading { color: var(--muted); padding: 24px 0; }

  footer { margin-top: 48px; font-size: .8rem; color: var(--muted); }
  footer .ver { margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  footer .ver.warn { color: #8A1F1F; font-weight: 700; }

  /* ---------- 活動：職缺摘要＋展開（v2.2.0） ---------- */
  .jobs { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .jobs-sum { margin: 0 0 8px; font-size: .92rem; }
  .jobs-sum strong { font-variant-numeric: tabular-nums; }
  .jobs details > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: .9rem; font-weight: 700; color: var(--navy);
    border: 1px solid var(--navy); border-radius: 999px; padding: 4px 14px;
  }
  .jobs details > summary::-webkit-details-marker { display: none; }
  .jobs details > summary .chev { transition: transform .2s; }
  .jobs details[open] > summary .chev { transform: rotate(90deg); }
  .jobs details[open] > summary { background: var(--navy); color: #fff; }
  .co { margin-top: 14px; }
  .co-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .co-name { font-weight: 700; }
  .co-ind { font-size: .8rem; color: var(--muted); }
  .co-n { margin-left: auto; font-size: .8rem; color: var(--muted); }
  .job { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .job:last-child { border-bottom: 0; }
  .job-t { font-weight: 500; }
  .job-t a { color: var(--ink); text-decoration: none; }
  .job-t a:hover { text-decoration: underline; }
  .job-d { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }
  .pay { justify-self: end; align-self: start; font-size: .88rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 0 8px; border-radius: 4px; background: #E6ECF4; color: var(--navy); }
  .pay small { font-weight: 500; font-size: .75rem; margin-right: 4px; }
  .pay.hour { background: #FCEFD6; color: #7A4A00; }
  .pay.other { background: #EEF1F5; color: var(--ink); }
  .jobs-foot { margin: 12px 0 0; font-size: .82rem; color: var(--muted); }

  @media (max-width: 560px) {
    html { font-size: 16px; }
    /* v2.3.0：手機版日期改成每天上方的橫條，滑動時黏在頂端 */
    .day { display: block; margin-bottom: 22px; }
    .leaf {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: baseline; gap: 8px; text-align: left;
      background: var(--paper); border: 0; border-bottom: 2px solid var(--navy); border-radius: 0;
      padding: 8px 2px 6px; margin-bottom: 8px;
    }
    .leaf .mo, .leaf .d { display: none; }
    .leaf .md { display: inline; font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 1.35rem; line-height: 1; color: var(--navy); font-variant-numeric: lining-nums; }
    .leaf .wd { display: inline; font-size: .85rem; }
    .leaf .rel { margin: 0 0 0 auto; font-size: .78rem; border: 1px solid var(--navy); border-radius: 999px; padding: 0 8px; }
    .leaf.is-today { background: var(--navy); border-bottom: 0; border-radius: var(--radius-s); padding: 7px 10px; }
    .leaf.is-today .md { color: #fff; }
    .leaf.is-today .rel { color: var(--navy); background: #fff; border-color: #fff; }
    .leaf.undated .d { display: inline; font-size: 1rem; padding: 0; color: var(--navy); }
    .leaf.undated br { display: none; }
    .job { grid-template-columns: 1fr; }
    .pay { justify-self: start; margin-top: 2px; }
    .notice details > summary { grid-template-columns: 1fr auto; }
    .notice .n-date { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1>就業資訊公告欄</h1>
    <p id="stamp">讀取中…</p>
  </div>
</header>

<main class="wrap">
  <div id="demoNote" class="demo-note" hidden>
    目前顯示範例資料。部署到 GAS 後會自動改用試算表的真實資料；若放在別的網站，請在程式最上方填入 API_URL。
  </div>

  <section id="noticeSection" aria-labelledby="h-notice">
    <h2 id="h-notice">公告</h2>
    <div id="notices"><p class="loading">讀取中…</p></div>
  </section>

  <section aria-labelledby="h-events">
    <h2 id="h-events">雙北徵才活動</h2>
    <div class="filters">
      <div class="seg" role="group" aria-label="縣市" data-filter="city">
        <button type="button" data-v="" aria-pressed="true">全部</button>
        <button type="button" data-v="臺北市" aria-pressed="false">臺北市</button>
        <button type="button" data-v="新北市" aria-pressed="false">新北市</button>
      </div>
      <div class="seg" role="group" aria-label="活動類型" data-filter="type">
        <button type="button" data-v="" aria-pressed="true">全部</button>
        <button type="button" data-v="就業博覽會" aria-pressed="false">就業博覽會</button>
        <button type="button" data-v="聯合徵才" aria-pressed="false">聯合徵才</button>
        <button type="button" data-v="現場徵才" aria-pressed="false">現場徵才</button>
      </div>
      <label class="toggle"><input type="checkbox" id="showPast"> 顯示已結束</label>
    </div>
    <div class="calendar" aria-label="月曆導覽">
      <div class="cal-head">
        <button type="button" id="calPrev" aria-label="上個月">‹</button>
        <span class="cal-label" id="calLabel"></span>
        <button type="button" id="calNext" aria-label="下個月">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="cal-filter" id="calFilter" hidden></div>
    <p class="count" id="count"></p>
    <div id="events"><p class="loading">讀取中…</p></div>
  </section>

  <footer>
    資料來源：台灣就業通、臺北市就業服務處、新北市人力網。活動內容以主辦單位公告為準，出發前請點「查看詳細資訊」確認。
    <p class="ver" id="ver"></p>
  </footer>
</main>

<script>
/* 若這個 HTML 放在 GAS 以外的地方（例如 GitHub Pages、Google Sites 內嵌），
   請填入 Web App 部署網址，例如 https://script.google.com/macros/s/xxxx/exec */
const API_URL = 'https://script.google.com/macros/s/AKfycbwctcAKI6zZwZ8UfG9tvivFMaQY1pD36ffh_EKmzYRikTEjPLxQ1i_uPQkYU0K6BfjNPg/exec';

const FRONT_VER = 'v2.3.0'; // 網頁版本，改版時記得一起改

const state = { data: null, city: '', type: '', showPast: false, calMonth: '', calFilterDate: null };
const WEEK = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
const WEEK_S = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- 取資料 ---------- */
function load() {
  const inGas = typeof google !== 'undefined' && google.script && google.script.run;
  if (inGas) {
    google.script.run.withSuccessHandler(onData).withFailureHandler(e => showError(e.message || e)).getData();
  } else if (API_URL) {
    fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'api=1')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(onData)
      .catch(e => showError(e.message));
  } else {
    document.getElementById('demoNote').hidden = false;
    onData(DEMO);
  }
}

function onData(data) {
  state.data = data;
  const t = fmtLong(data.today || localToday());
  document.getElementById('stamp').textContent =
    '今天 ' + t + (data.updatedAt ? '　活動資料更新於 ' + data.updatedAt : '');
  state.calMonth = (data.today || localToday()).slice(0, 7);
  renderVersion(data.version);
  renderNotices();
  renderEvents();
}

function showError(msg) {
  const html = '<div class="error">無法讀取資料：' + esc(msg) +
    '<br>請確認 Web App 已部署且存取權設為「所有人」，或 API_URL 是否正確。</div>';
  document.getElementById('notices').innerHTML = html;
  document.getElementById('events').innerHTML = '';
  document.getElementById('stamp').textContent = '讀取失敗';
}

/* ---------- 公告 ---------- */
function renderNotices() {
  const list = state.data.notices || [];
  const section = document.getElementById('noticeSection');
  const box = document.getElementById('notices');
  if (!list.length) {
    section.hidden = true;
    box.innerHTML = '';
    return;
  }
  section.hidden = false;
  box.innerHTML = '<ul class="notices">' + list.map((n, i) => `
    <li class="notice${n.pinned ? ' pinned' : ''}">
      <details${i === 0 && n.pinned ? ' open' : ''}>
        <summary>
          <span class="n-date">${esc(n.date)}</span>
          <span class="n-title">${n.pinned ? '<span class="pin-tag">置頂</span>' : ''}${esc(n.title)}</span>
          <span class="chev" aria-hidden="true">›</span>
        </summary>
        <div class="n-body">${esc(n.content || '')}${n.url ? `<br><a href="${attr(n.url)}" target="_blank" rel="noopener">開啟相關連結</a>` : ''}</div>
      </details>
    </li>`).join('') + '</ul>';
}

/* ---------- 活動 ---------- */
function renderEvents() {
  const today = state.data.today || localToday();
  const all = state.data.events || [];
  const base = all.filter(e =>
    (!state.city || e.city === state.city) &&
    (!state.type || e.type === state.type) &&
    (state.showPast || !e.date || e.date >= today)
  );

  // 依日期分組（用來畫月曆的色點，不受「篩選成當天」影響，這樣切換日期時月曆的點還在）
  const groups = {};
  base.forEach(e => (groups[e.date || '~'] = groups[e.date || '~'] || []).push(e));
  renderCalendar(groups, today);

  // 若有點月曆挑某一天，畫面上的清單再縮小成那一天
  const list = state.calFilterDate ? (groups[state.calFilterDate] || []) : base;

  const filterBox = document.getElementById('calFilter');
  if (state.calFilterDate) {
    filterBox.hidden = false;
    filterBox.innerHTML = `已篩選：${fmtShort(state.calFilterDate)} <button type="button" id="calClear">顯示全部</button>`;
    document.getElementById('calClear').addEventListener('click', () => { state.calFilterDate = null; renderEvents(); });
  } else {
    filterBox.hidden = true;
    filterBox.innerHTML = '';
  }

  document.getElementById('count').textContent = list.length ? `共 ${list.length} 場活動` : '';

  const box = document.getElementById('events');
  if (!list.length) {
    box.innerHTML = '<div class="empty">目前沒有符合條件的活動。可以改選「全部」，或勾選「顯示已結束」。</div>';
    return;
  }

  // 依日期分組顯示，無日期的放最後
  const dayGroups = {};
  list.forEach(e => (dayGroups[e.date || '~'] = dayGroups[e.date || '~'] || []).push(e));
  const keys = Object.keys(dayGroups).sort();

  box.innerHTML = keys.map(k => {
    const evs = dayGroups[k];
    return `<div class="day">${leaf(k, today)}<ul class="items">${evs.map(e => item(e, k !== '~' && k < today)).join('')}</ul></div>`;
  }).join('');
}

/* ---------- 月曆導覽 ---------- */
function renderCalendar(groups, today) {
  const [y, mo] = state.calMonth.split('-').map(Number);
  document.getElementById('calLabel').textContent = `${y}年${mo}月`;

  const first = new Date(y, mo - 1, 1);
  const days = new Date(y, mo, 0).getDate();
  const startWd = first.getDay();

  let cells = '';
  for (let i = 0; i < startWd; i++) cells += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= days; d++) {
    const date = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const evs = groups[date] || [];
    const hasTpe = evs.some(e => e.city === '臺北市');
    const hasNtpc = evs.some(e => e.city === '新北市');
    const isToday = date === today;
    const isPast = date < today;
    const cls = ['cal-cell'];
    if (evs.length) cls.push('has-events');
    if (isToday) cls.push('is-today');
    if (isPast) cls.push('is-past');
    if (date === state.calFilterDate) cls.push('is-selected');
    const dots = evs.length ? `<span class="cal-dot">${hasTpe ? '<span></span>' : ''}${hasNtpc ? '<span class="ntpc"></span>' : ''}</span>` : '<span class="cal-dot"></span>';
    const label = `${mo}月${d}日${evs.length ? '，' + evs.length + ' 場活動' : '，沒有活動'}`;
    cells += evs.length
      ? `<button type="button" class="${cls.join(' ')}" data-date="${date}" aria-label="${label}" title="${label}"><span class="cal-n">${d}</span>${dots}</button>`
      : `<div class="${cls.join(' ')}" aria-label="${label}"><span class="cal-n">${d}</span>${dots}</div>`;
  }

  document.getElementById('calGrid').innerHTML =
    WEEK_S.map(w => `<div class="cal-wd">${w}</div>`).join('') + cells;
}

function shiftMonth(delta) {
  const [y, mo] = state.calMonth.split('-').map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  state.calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  state.calFilterDate = null; // 換月份時，先前挑的那一天篩選就取消，避免看不到自己選了什麼
  if (state.data) renderEvents();
}

document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));
document.getElementById('calGrid').addEventListener('click', ev => {
  const btn = ev.target.closest('.cal-cell[data-date]');
  if (!btn) return;
  // 再點一次同一天＝取消篩選；點別天＝篩選成那一天
  state.calFilterDate = state.calFilterDate === btn.dataset.date ? null : btn.dataset.date;
  renderEvents();
});

/* ---------- 版本編號（v2.3.0） ---------- */
function renderVersion(backVer) {
  const el = document.getElementById('ver');
  const same = !backVer || backVer === FRONT_VER;
  el.className = 'ver' + (same ? '' : ' warn');
  el.textContent = same
    ? `版本 ${FRONT_VER}`
    : `網頁 ${FRONT_VER}、後端 ${backVer}：兩個版本不一致，請確認 Code.gs 和 index 都已更新`;
}
renderVersion();

function leaf(date, today) {
  if (date === '~') return '<div class="leaf undated"><span class="d">日期<br>待確認</span></div>';
  const d = new Date(date + 'T00:00:00');
  const diff = Math.round((d - new Date(today + 'T00:00:00')) / 86400000);
  const rel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff > 1 ? diff + ' 天後' : '已結束';
  const cls = diff === 0 ? ' is-today' : diff < 0 ? ' is-past' : '';
  return `<div class="leaf${cls}" aria-label="${date}（${rel}）">
    <span class="md">${d.getMonth() + 1}/${d.getDate()}</span>
    <span class="mo">${d.getMonth() + 1}月</span>
    <span class="d">${d.getDate()}</span>
    <span class="wd">${WEEK[d.getDay()]}</span>
    <span class="rel">${rel}</span>
  </div>`;
}

function item(e, past) {
  const isN = e.city === '新北市';
  const isGuess = /\?$/.test(e.district || '');
  const distName = (e.district || '').replace(/\?$/, '');
  const distHtml = distName
    ? (isGuess
        ? `・<span class="dist-guess" title="行政區為推測，僅供參考">${esc(distName)}</span>`
        : `・${esc(distName)}`)
    : '';
  return `<li class="ev${isN ? ' ntpc' : ''}${past ? ' past' : ''}">
    <div class="tags">
      <span class="tag ${isN ? 'ntpc' : 'tpe'}">${esc(e.city)}${distHtml}</span>
      <span class="tag type${e.type === '就業博覽會' ? ' fair' : ''}">${esc(e.type)}</span>
    </div>
    <h3>${esc(e.title)}</h3>
    <p class="meta">
      ${e.time ? `<span>時間 ${esc(e.time)}</span>` : ''}
      ${e.place ? `<span>地點 ${esc(e.place)}</span>` : ''}
      ${e.firms ? `<span>${esc(e.firms)} 家廠商</span>` : ''}
    </p>
    ${e.address ? `<p class="meta addr"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.address)}" target="_blank" rel="noopener">${esc(e.address)}</a></p>` : ''}
    <p class="meta">
      ${e.org ? `<span>承辦 ${esc(e.org)}</span>` : ''}
      ${e.url ? `<a href="${attr(e.url)}" target="_blank" rel="noopener">查看詳細資訊</a>` : ''}
    </p>
    ${jobsBlock(e)}
  </li>`;
}

/* ---------- 職缺摘要＋展開（v2.2.0） ---------- */
const PAY_LABEL = { M: '月薪', H: '時薪', D: '日薪', Y: '年薪' };
const JOB_URL = 'https://job.taiwanjobs.gov.tw/internet/Index/JobDetail.aspx?R2=15';

function jobsBlock(e) {
  let data;
  try { data = e.jobs ? JSON.parse(e.jobs) : null; } catch (err) { return ''; }
  const cos = (data && data.c) || [];
  if (!cos.length) return '';

  const all = cos.flatMap(c => c[3] || []);
  const low = k => {
    const nums = all.filter(j => j[1] === k).map(j => +String(j[2]).replace(/,/g, '').match(/\d+/)).filter(n => n > 0);
    return nums.length ? Math.min(...nums).toLocaleString('en-US') : '';
  };
  const pays = [['M', low('M')], ['H', low('H')]].filter(p => p[1]).map(p => `${PAY_LABEL[p[0]]} <strong>${p[1]}</strong> 起`);
  const sum = all.length
    ? `<strong>${cos.length}</strong> 家公司、<strong>${all.length}</strong> 個職缺${pays.length ? '，' + pays.join('、') : ''}`
    : `<strong>${cos.length}</strong> 家公司參加，職缺明細請看官網`;

  const req = (edu, exp) => (edu === '不拘' && exp === '不拘') ? '學歷經歷不拘'
    : [edu && `學歷${edu}`, exp && `經歷${exp}`].filter(Boolean).join('、');

  const list = cos.map(([name, ind, emp, jobs]) => `
    <section class="co">
      <div class="co-head"><span class="co-name">${esc(name)}</span>${ind ? `<span class="co-ind">${esc(ind)}</span>` : ''}${(jobs || []).length ? `<span class="co-n">${jobs.length} 個職缺</span>` : ''}</div>
      ${(jobs || []).map(([t, k, pay, loc, edu, exp, n, hire]) => {
        const title = emp && hire
          ? `<a href="${JOB_URL}&EMPLOYER_ID=${encodeURIComponent(emp)}&HIRE_ID=${encodeURIComponent(hire)}" target="_blank" rel="noopener">${esc(t)}</a>`
          : esc(t);
        const cls = k === 'H' ? ' hour' : k === 'M' ? '' : ' other';
        const detail = [loc, req(edu, exp), n && `徵 ${n} 人`].filter(Boolean).map(esc).join('，');
        return `<div class="job">
          <span class="job-t">${title}</span>
          ${pay ? `<span class="pay${cls}">${PAY_LABEL[k] ? `<small>${PAY_LABEL[k]}</small>` : ''}${esc(pay)}</span>` : ''}
          ${detail ? `<span class="job-d">${detail}</span>` : ''}
        </div>`;
      }).join('')}
    </section>`).join('');

  const firms = +e.firms || 0;
  const notes = [];
  if (data.cut || firms > cos.length) notes.push(`官網列出${firms > cos.length ? ` ${firms} 家` : '更多'}公司，這裡只放得下 ${cos.length} 家，完整清單請點「查看詳細資訊」。`);
  notes.push(`職缺資料${e.jobsAt ? `抓取於 ${fmtShort(e.jobsAt)}` : '每天早上更新'}，最新內容以台灣就業通為準。`);

  return `<div class="jobs">
    <p class="jobs-sum">${sum}</p>
    <details>
      <summary><span class="chev" aria-hidden="true">›</span>${all.length ? `看 ${cos.length} 家公司的職缺` : `看 ${cos.length} 家參加公司`}</summary>
      ${list}
      <p class="jobs-foot">${notes.join('<br>')}</p>
    </details>
  </div>`;
}

/* ---------- 篩選 ---------- */
document.querySelectorAll('.seg').forEach(seg => {
  seg.addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
    state[seg.dataset.filter] = btn.dataset.v;
    if (state.data) renderEvents();
  });
});
document.getElementById('showPast').addEventListener('change', e => {
  state.showPast = e.target.checked;
  if (state.data) renderEvents();
});

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function attr(url) { return /^https?:\/\//i.test(url) ? esc(url) : '#'; }
function localToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtLong(ymd) {
  const d = new Date(ymd + 'T00:00:00');
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()].slice(1)}）`;
}
function fmtShort(ymd) {
  const d = new Date(ymd + 'T00:00:00');
  return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()].slice(1)}）`;
}
